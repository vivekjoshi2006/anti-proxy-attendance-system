<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Attendance Check-In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Light Theme & Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col items-center justify-center relative selection:bg-indigo-500 selection:text-white bg-indigo-50/30">

    <!-- Floating Mesh Glows -->
    <div class="glow-orb glow-indigo"></div>
    <div class="glow-orb glow-emerald"></div>
    <div class="glow-orb glow-amber"></div>

    <div class="max-w-md w-full relative z-10 space-y-4 my-auto">

        <!-- Campus Badge -->
        <div class="glass-panel p-6 text-center relative overflow-hidden space-y-3 bg-white/80 border-indigo-100">
            <div class="absolute -right-12 -top-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
            
            <div class="w-16 h-16 mx-auto rounded-3xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-indigo-600 p-0.5 shadow-xl shadow-emerald-500/25 flex items-center justify-center">
                <div class="w-full h-full bg-white rounded-[22px] flex items-center justify-center">
                    <i data-lucide="shield-check" class="w-8 h-8 text-emerald-600"></i>
                </div>
            </div>

            <div>
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[13px] font-black tracking-wider bg-emerald-50 text-emerald-700 border border-emerald-200 uppercase mb-1.5 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Live Lecture QR
                </span>
                <h1 class="text-[13px] font-black text-indigo-950 tracking-tight" id="dispSubject">CSE01: SDE</h1>
                <p id="dispDate" class="text-[13px] font-semibold text-indigo-600 mt-0.5">Faculty: Dr. AB</p>
            </div>
        </div>

        <!-- Success Feedback Card -->
        <div class="glass-panel p-6 space-y-4 relative bg-white/80 border-indigo-100" id="mainCard">

            <!-- Check-in Form Inputs -->
            <div id="checkinForm" class="space-y-3.5">
                <div>
                    <label class="block text-[13px] font-extrabold text-indigo-900 mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="book-open" class="w-3.5 h-3.5 text-indigo-600"></i> Current Lecture
                    </label>
                    <select id="qrClassSelect" class="w-full glass-input px-3.5 py-3 text-[13px] text-indigo-950 font-bold outline-none cursor-pointer border-indigo-200 focus:border-indigo-500 bg-indigo-50/30">
                        <option value="">Detecting Lecture...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[13px] font-extrabold text-indigo-900 mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="hash" class="w-3.5 h-3.5 text-indigo-600"></i> Student Roll Number
                    </label>
                    <input type="text" id="stuRollNo" placeholder="e.g. 01CSE" class="w-full glass-input px-3.5 py-3 text-[13px] text-indigo-950 uppercase font-mono font-extrabold placeholder:font-sans placeholder:text-indigo-400 border-indigo-200 focus:border-indigo-500 bg-indigo-50/30">
                </div>

                <div>
                    <label class="block text-[13px] font-extrabold text-indigo-900 mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="user" class="w-3.5 h-3.5 text-indigo-600"></i> Full Name (Optional)
                    </label>
                    <input type="text" id="stuName" placeholder="e.g. Aarav Sharma" class="w-full glass-input px-3.5 py-3 text-[13px] text-indigo-950 font-semibold placeholder:text-indigo-400 border-indigo-200 focus:border-indigo-500 bg-indigo-50/30">
                </div>

                <button onclick="submitQRAttendance()" id="btnSubmit" class="w-full py-3.5 btn-gradient-success rounded-2xl font-black text-[13px] flex items-center justify-center gap-2 mt-2 active:scale-[0.99] cursor-pointer shadow-lg shadow-emerald-500/25 transition-all">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i> Confirm Attendance Check-In
                </button>
            </div>

            <!-- Animated Success State -->
            <div id="successCard" class="hidden text-center py-4 space-y-3 animate-success-pop">
                <div class="w-16 h-16 mx-auto rounded-3xl bg-emerald-100 border-2 border-emerald-300 text-emerald-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i data-lucide="check" class="w-9 h-9 stroke-[3]"></i>
                </div>
                <div class="space-y-1">
                    <h3 class="text-[13px] font-black text-indigo-950" id="successStudent">Attendance Verified!</h3>
                    <p class="text-[13px] text-emerald-700 font-bold" id="successTime">Recorded at 10:30 AM</p>
                </div>
                <div class="p-3 bg-emerald-50/80 rounded-xl border border-emerald-200 text-[13px] text-emerald-800 font-semibold space-y-1 text-left">
                    <div class="flex justify-between"><span>Subject:</span> <strong id="successSub">CSE01: SDE</strong></div>
                    <div class="flex justify-between"><span>Status:</span> <strong class="text-emerald-700">PRESENT (QR Scan)</strong></div>
                    <div class="flex justify-between"><span>Device Lock:</span> <span class="font-mono text-[13px]">VERIFIED</span></div>
                </div>
            </div>

            <!-- Error Banner -->
            <div id="statusAlert" class="hidden p-3.5 rounded-xl text-[13px] font-bold text-center border"></div>
        </div>

        <!-- Date Lookup Dropdown Card -->
        <div class="glass-panel p-5 space-y-3 bg-white/80 border-indigo-100">
            <div class="flex items-center justify-between">
                <h3 class="text-[13px] font-black text-indigo-950 flex items-center gap-1.5">
                    <i data-lucide="calendar" class="w-4 h-4 text-amber-500"></i> Check Past Attendance
                </h3>
            </div>
            
            <div class="flex items-center gap-2">
                <input type="text" id="checkDateCalendar" placeholder="Pick Date" class="flex-1 glass-input px-3.5 py-2.5 text-[13px] text-indigo-600 font-mono font-bold text-center cursor-pointer border-indigo-200 focus:border-indigo-500 bg-indigo-50/30" readonly>
                
                <button onclick="fetchClassesForDate()" class="px-5 py-2.5 bg-gradient-to-r from-indigo-600 via-indigo-500 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-[13px] font-extrabold rounded-xl transition-all shadow-md shadow-indigo-500/30 active:scale-95 cursor-pointer flex items-center gap-1.5">
                    <i data-lucide="search" class="w-3.5 h-3.5 text-white"></i> View
                </button>
            </div>

            <div id="dateResults" class="hidden space-y-2 pt-2 border-t border-indigo-100 max-h-52 overflow-y-auto"></div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlSessionId = urlParams.get('s') || "";
        const urlSub = urlParams.get('sub') || "";
        const urlFac = urlParams.get('fac') || "";
        const urlDate = urlParams.get('date') || "";

        if (urlSub) document.getElementById('dispSubject').innerText = decodeURIComponent(urlSub);
        if (urlDate || urlFac) {
            document.getElementById('dispDate').innerText = `${decodeURIComponent(urlDate || 'Today')} • ${decodeURIComponent(urlFac || 'Dr. AB')}`;
        }

        let deviceId = 'DEV-MOBILE';
        try {
            deviceId = localStorage.getItem('qr_device_id') || ('DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase());
            localStorage.setItem('qr_device_id', deviceId);
        } catch(e) {}

        let selectedCalendarDate = new Date().toISOString().split('T')[0];

        if (typeof flatpickr !== 'undefined') {
            flatpickr("#checkDateCalendar", {
                dateFormat: "Y-m-d",
                altInput: true,
                altFormat: "d M Y",
                theme: "material_blue",
                defaultDate: "today",
                disableMobile: true,
                onChange: (dates, dateStr) => { selectedCalendarDate = dateStr; }
            });
        }

        async function initScanPage() {
            try {
                const res = await fetch('/api/sessions');
                if (res.ok) {
                    const data = await res.json();
                    const currentClass = (data.sessions || []).find(s => s.sessionId === urlSessionId) || data.activeSession;
                    if (currentClass) {
                        document.getElementById('dispSubject').innerText = currentClass.subject;
                        document.getElementById('dispDate').innerText = `${currentClass.dateDisplay} • ${currentClass.instructor}`;
                    }

                    const select = document.getElementById('qrClassSelect');
                    if (select && data.sessions) {
                        select.innerHTML = '';
                        data.sessions.forEach(s => {
                            const isSelected = (s.sessionId === urlSessionId || s.sessionId === data.activeSessionId) ? 'selected' : '';
                            select.innerHTML += `<option value="${s.sessionId}" ${isSelected}>${s.subject} (${s.room})</option>`;
                        });
                    }
                }
            } catch(e) {}
            if (window.lucide) lucide.createIcons();
        }

        async function submitQRAttendance() {
            const rollNo = document.getElementById('stuRollNo').value.trim().toUpperCase();
            const studentName = document.getElementById('stuName').value.trim();
            const alertBox = document.getElementById('statusAlert');
            const select = document.getElementById('qrClassSelect');
            const sessionId = (select && select.value) ? select.value : urlSessionId;

            if (!rollNo) {
                alertBox.className = "p-3 rounded-xl text-[13px] font-bold text-center border bg-rose-50 text-rose-600 border-rose-200";
                alertBox.innerText = "Please enter your Roll Number (e.g. 01CSE)!";
                alertBox.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/attendance/qr-mark', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rollNo, studentName, sessionId, deviceId })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('checkinForm').classList.add('hidden');
                    alertBox.classList.add('hidden');
                    
                    document.getElementById('successStudent').innerText = `Verified: ${data.student.name} (${data.student.rollNo})`;
                    document.getElementById('successTime').innerText = `Recorded at ${data.time} (${data.date})`;
                    document.getElementById('successSub').innerText = data.subject;
                    document.getElementById('successCard').classList.remove('hidden');
                } else {
                    alertBox.className = "p-3 rounded-xl text-[13px] font-bold text-center border bg-rose-50 text-rose-600 border-rose-200";
                    alertBox.innerText = data.message;
                    alertBox.classList.remove('hidden');
                }
            } catch (e) {
                alertBox.className = "p-3 rounded-xl text-[13px] font-bold text-center border bg-rose-50 text-rose-600 border-rose-200";
                alertBox.innerText = "Failed to mark attendance. Verify Wi-Fi network.";
                alertBox.classList.remove('hidden');
            }
            if (window.lucide) lucide.createIcons();
        }

        async function fetchClassesForDate() {
            const rollNo = document.getElementById('stuRollNo').value.trim().toUpperCase();
            const resBox = document.getElementById('dateResults');
            if (!rollNo) {
                resBox.innerHTML = `<p class="text-rose-600 text-[13px] font-bold p-2 bg-rose-50 rounded-lg">Enter Roll Number (e.g. 01CSE) above first.</p>`;
                resBox.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`/api/student/classes-by-date?rollNo=${encodeURIComponent(rollNo)}&dateISO=${selectedCalendarDate}`);
                const data = await res.json();

                if (!data.success) {
                    resBox.innerHTML = `<p class="text-rose-600 text-[13px] font-bold p-2 bg-rose-50 rounded-lg">${data.message}</p>`;
                } else {
                    let html = `<div class="text-[13px] font-black text-indigo-700 pb-1">Records for ${data.dateDisplay}:</div>`;
                    data.classes.forEach(c => {
                        const isP = c.status === 'PRESENT';
                        html += `
                            <div class="p-3 bg-white/90 rounded-xl border border-indigo-100 flex justify-between items-center text-[13px] shadow-sm">
                                <div>
                                    <strong class="text-indigo-950 block font-bold text-[13px]">${c.subject}</strong>
                                    <span class="text-[13px] text-indigo-500">${c.instructor}</span>
                                </div>
                                <span class="px-2.5 py-1 rounded-lg text-[13px] font-black ${isP ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-rose-100 text-rose-800 border border-rose-200'}">${c.status}</span>
                            </div>
                        `;
                    });
                    resBox.innerHTML = html;
                }
                resBox.classList.remove('hidden');
            } catch (e) {
                resBox.innerHTML = `<p class="text-rose-600 text-[13px] font-bold">Unable to load classes.</p>`;
                resBox.classList.remove('hidden');
            }
            if (window.lucide) lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', initScanPage);
    </script>
</body>
</html>
